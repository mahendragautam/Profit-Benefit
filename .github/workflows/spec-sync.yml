name: Spec index sync check

on:
  push:
  pull_request:

jobs:
  spec-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run spec sync check
        run: |
          python3 scripts/spec_sync.py

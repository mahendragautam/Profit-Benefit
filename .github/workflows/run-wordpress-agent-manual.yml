name: "Run WordPress Theme Agent (manual)"

on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to run'
        required: false
        default: 'wordpress.theme.agent'
      run_mode:
        description: 'Run mode'
        required: false
        default: 'manual'

jobs:
  run-agent:
    name: Run Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: |
          if [ -f composer.json ]; then composer install --no-interaction --prefer-dist; fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run spec sync
        run: python3 scripts/spec_sync.py --agent "${{ github.event.inputs.agent }}" --run-mode "${{ github.event.inputs.run_mode }}"
        env:
          AGENT_NAME: ${{ github.event.inputs.agent }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}

      - name: Upload agent reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reports
          path: .vscode/agent-reports/*.json

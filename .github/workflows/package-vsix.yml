name: Package VSIX (CI)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install packaging tool
        run: |
          npm ci --silent || true
          npm install --no-audit --no-fund @vscode/vsce@^2.0.0 --no-save

      - name: Package VSIX
        working-directory: .vscode/extensions/wordpress-theme-agent
        run: |
          npx --yes @vscode/vsce package --no-dependencies --out wordpress-theme-agent-${{ github.run_number }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-theme-agent-vsix
          path: .vscode/extensions/wordpress-theme-agent/*.vsix
